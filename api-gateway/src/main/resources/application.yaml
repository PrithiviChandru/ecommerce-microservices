server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # Auth Service
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            # Product Service
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

            - id: category-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/categories/**

            # Order Service
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true